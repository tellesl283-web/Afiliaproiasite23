<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AfiliAI Pro — Afiliados Inteligentes</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#14152b;--mu:#667090;--bd:#e3e6f3;--ac:#6d5efc;--ac2:#22d3ee;--ok:#16a34a;--wa:#d97706;--er:#dc2626;--sb:#0e0f24;--chip:#eeecff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090a1a;--card:#13152d;--tx:#eceefc;--mu:#9ba0c8;--bd:#25284b;--chip:#232256;--sb:#070817}}
:root[data-theme="dark"]{--bg:#090a1a;--card:#13152d;--tx:#eceefc;--mu:#9ba0c8;--bd:#25284b;--chip:#232256;--sb:#070817}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
#sb{background:var(--sb);color:#cfd2f5;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.logo i{font-style:normal;width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-weight:800}
.logo strong{color:#fff;font-size:17px}.logo em{color:#a99dff;font-style:normal}.logo small{display:block;font-size:9px;letter-spacing:.14em;color:#8286b8}
.ni{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#aeb2e0;font-size:14px}
.ni span{width:20px;text-align:center}.ni:hover{background:#1a1c3d}.ni.on{background:linear-gradient(90deg,#2a2670,#181a3f);color:#fff;box-shadow:inset 3px 0 var(--ac)}
.ni b{margin-left:auto;background:#f59e0b;color:#000;border-radius:99px;font-size:11px;padding:1px 8px}
.lim{margin-top:auto;background:#161838;border:1px solid #2a2d5c;border-radius:16px;padding:14px}
.lim small{color:#8d92c4}.lim h3{margin:2px 0 10px;color:#fff;font-size:24px}
.bar{height:8px;border-radius:9px;background:#2a2d5c;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
main{padding:28px;max-width:1100px;width:100%}
.eyebrow{color:var(--ac);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
h1{margin:4px 0 4px;font-size:30px;letter-spacing:-.02em}.sub{color:var(--mu);margin:0 0 22px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:16px}.mu{color:var(--mu);font-size:13px}
.kpi b{display:block;font-size:28px;letter-spacing:-.02em;margin-top:4px}
.ai{background:linear-gradient(135deg,rgba(109,94,252,.14),rgba(34,211,238,.1));border-color:rgba(109,94,252,.4)}
.btn{all:unset;cursor:pointer;background:linear-gradient(135deg,var(--ac),#8a5cff);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;display:inline-block}
.btn.s{background:var(--chip);color:var(--ac)}.btn.d{background:rgba(220,38,38,.12);color:var(--er)}.btn.g{background:rgba(22,163,74,.14);color:var(--ok)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--chip);color:var(--ac)}
.badge.ok{background:rgba(22,163,74,.15);color:var(--ok)}.badge.wa{background:rgba(217,119,6,.16);color:var(--wa)}.badge.er{background:rgba(220,38,38,.14);color:var(--er)}
.score{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:conic-gradient(var(--ac) var(--p),var(--bd) 0);position:relative;flex:none}
.score::after{content:attr(data-s);position:absolute;inset:5px;border-radius:50%;background:var(--card);color:var(--tx);display:grid;place-items:center;font-size:14px}
.an{margin-top:10px;padding:12px;border-radius:12px;background:var(--bg);font-size:13px;display:grid;gap:4px}
.ch{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:12px}
.ch div{flex:1;background:linear-gradient(180deg,var(--ac2),var(--ac));border-radius:8px 8px 3px 3px;min-height:4px;position:relative}
.chat{display:grid;gap:10px;max-height:52vh;overflow:auto;margin:12px 0}
.m{padding:10px 14px;border-radius:14px;max-width:88%;white-space:normal}.m.u{background:var(--ac);color:#fff;justify-self:end}.m.a{background:var(--bg);border:1px solid var(--bd)}
.empty{text-align:center;color:var(--mu);padding:26px}
#bn{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#14152b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw}
#toast.on{opacity:1}
@media (max-width:899px){
.app{grid-template-columns:1fr}#sb{display:none}main{padding:20px 16px 110px}h1{font-size:26px}
#bn{display:flex;position:fixed;left:0;right:0;bottom:0;bottom:0;background:var(--sb);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
#bn .ni{flex:1;flex-direction:column;gap:2px;font-size:10px;padding:7px 2px;text-align:center;position:relative}#bn .ni.on{box-shadow:none;background:#23236a}#bn .ni b{position:absolute;top:2px;right:8px;padding:0 6px}}
.ni span{display:grid}.ni svg,.kpi svg,.card h3 svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.kpi svg{width:22px;height:22px;color:var(--ac);vertical-align:-5px;margin-right:6px}.card h3 svg{vertical-align:-4px;margin-right:6px;color:var(--ac)}
:root{--ac:#10b981;--ac2:#38bdf8;--chip:#e0f7ee;--sb:#06131a;--bg:#f2f7f6;--bd:#dbe7e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07120f;--card:#0e1d1b;--bd:#1b3330;--chip:#12332e;--sb:#04100d}}
:root[data-theme="dark"]{--bg:#07120f;--card:#0e1d1b;--bd:#1b3330;--chip:#12332e;--sb:#04100d}
.ni:hover{background:#0f2a30}.ni.on{background:linear-gradient(90deg,#0d4a45,#0a2530)}.lim{background:#0b2128;border-color:#17414a}.bar{background:#17414a}
.btn{background:linear-gradient(135deg,var(--ac),#0ea5a4)}.ai{background:linear-gradient(135deg,rgba(16,185,129,.14),rgba(56,189,248,.1));border-color:rgba(16,185,129,.4)}
.logo em{color:#f5c451}.logo i{background:linear-gradient(135deg,#10b981,#38bdf8)}.ch div{background:linear-gradient(180deg,#38bdf8,#10b981)}#bn .ni.on{background:#0d4a45}
@media (max-width:899px){#bn{overflow-x:auto}#bn .ni{flex:0 0 64px}}
</style>
</head>
<body>
<div class="app"><aside id="sb"></aside><main id="main"></main></div>
<nav id="bn"></nav><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>'R$ '+(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
let TK=sessionStorage.getItem('tk')||'';
const api=async(p,m,b)=>{const r=await fetch(p,{method:m||'GET',headers:{Authorization:'Bearer '+TK,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});if(r.status===401){TK=prompt('Token de acesso')||'';sessionStorage.setItem('tk',TK);if(TK)return api(p,m,b)}return r};
const dlf=({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
let S={limit:10,spent:0,day:today(),products:[],campaigns:[],posts:[],perfil:{},insight:''};
try{const r=localStorage.getItem('afiliai');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(S.day!==today()){S.day=today();S.spent=0}
let DB=null,cloud='local',pt;
const push=async()=>{try{const r=await api('/api/state','PUT',S);cloud=r.ok?'ok':'err'}catch(e){cloud='err'}};
const save=()=>{try{localStorage.setItem('afiliai',JSON.stringify(S))}catch(e){}clearTimeout(pt);pt=setTimeout(push,700)};
async function initCloud(){try{const r=await api('/api/state');if(r.ok){const d=await r.json();if(d&&d.products){S=Object.assign(S,d);if(S.day!==today()){S.day=today();S.spent=0}}else await push();cloud='ok'}else cloud='err';render()}catch(e){cloud='err'}}
const NAV=[['ov','Visão geral'],['pr','Produtos'],['dc','Descobrir'],['ca','Campanhas'],['ag','Agenda'],['ap','Aprovações'],['vt','Vitrine de vendas'],['gm','Gerente IA'],['sv','Servidor'],['as','Assistente IA'],['cv','Cofre'],['cf','Ajustes']];
let view='ov',chat=[],sm=null,busy=false,tt;
const pend=()=>S.campaigns.filter(c=>c.st==='pendente');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
async function ai(p,json){
  if(busy){toast('Aguarde a IA terminar…');return null}
  busy=true;
  try{
    const r=await api('/api/ai','POST',{prompt:p});if(!r.ok)throw{code:r.status===429?'rate_limited':'na'};
    const t=(await r.json()).text||'';if(!json)return t;
    const a=[t.indexOf('{'),t.indexOf('[')].filter(x=>x>=0);return JSON.parse(t.slice(Math.min(...a),Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'))+1));
  }catch(e){toast(e&&e.code==='not_granted'?'Permissão de IA negada.':e&&e.code==='rate_limited'?'Muitas requisições. Tente em instantes.':'IA indisponível neste momento.');return null}
  finally{busy=false}
}
const ctx=()=>'Contexto do usuário (afiliado brasileiro). Negócio: '+JSON.stringify(S.perfil||{})+'. Produtos: '+(S.products.map(p=>`${p.n} (${p.pl}, comissão ${p.cm}%, preço ${p.pr})`).join('; ')||'nenhum')+'. Campanhas: '+(S.campaigns.map(c=>`${c.pn} em ${c.canal}, orçamento ${c.b}, ${c.st}`).join('; ')||'nenhuma')+`. Limite diário: R$ ${S.limit}.`;
function go(v){if(view==='cv'&&v!=='cv'){VK=null;VD=null;SH={}}view=v;render()}
function shell(){
  const h=NAV.map(([i,l,c])=>`<button class="ni ${view===i?'on':''}" onclick="go('${i}')"><span>${ic(i)}</span>${l}${i==='ap'&&pend().length?`<b>${pend().length}</b>`:''}</button>`).join('');
  const pc=Math.min(100,S.limit?S.spent/S.limit*100:0);
  $('#sb').innerHTML=`<div class="logo"><i>A✦</i><div><strong>AfiliAI <em>Pro</em></strong><small>AFILIADOS INTELIGENTES</small></div></div><div class="mu" style="font-size:11px;letter-spacing:.14em;margin:0 12px 6px">ESPAÇO DE TRABALHO</div>${h}<div class="lim"><small>Limite diário</small><h3>${brl(S.limit)}</h3><div class="bar"><i style="width:${pc}%"></i></div><small>${brl(S.spent)} usados · gastos exigem sua aprovação</small></div>`;
  $('#bn').innerHTML=h.replace(/Visão geral/,'Início').replace(/Assistente IA/,'IA').replace(/Aprovações/,'Aprovar').replace(/Campanhas/,'Camp.').replace(/Vitrine de vendas/,'Vitrine');
}
const head=(e,t,s)=>`<div class="eyebrow">${e}</div><h1>${t}</h1><p class="sub">${s}</p>`;
function vOv(){
  const pr=S.products,an=pr.filter(p=>p.an),avg=an.length?Math.round(an.reduce((a,p)=>a+p.an.score,0)/an.length):'—';
  const cs=S.campaigns.slice(-7),mx=Math.max(1,...cs.map(c=>c.b));
  return head('Visão geral','Seu painel de afiliado','Acompanhe produtos, campanhas e o que precisa da sua aprovação.')+
  `<div class="grid"><div class="card kpi"><span class="mu">${ic('pr')}Produtos</span><b>${pr.length}</b></div><div class="card kpi"><span class="mu">${ic('ca')}Campanhas ativas</span><b>${S.campaigns.filter(c=>c.st==='aprovada').length}</b></div><div class="card kpi"><span class="mu">${ic('ap')}Aguardando aprovação</span><b>${pend().length}</b></div><div class="card kpi"><span class="mu">${ic('as')}Score médio (IA)</span><b>${avg}</b></div></div>
  <div class="card ai"><h3>✧ Resumo estratégico da IA</h3><p class="mu" style="white-space:pre-wrap">${esc(S.insight)||'Peça à IA uma leitura do seu cenário e as próximas ações recomendadas.'}</p><button class="btn" onclick="insight()">Gerar resumo</button></div>
  <div class="card"><h3>Orçamento das últimas campanhas</h3><div class="mu">Valores diários em R$</div>${cs.length?`<div class="ch">${cs.map(c=>`<div title="${esc(c.pn)}" style="height:${Math.max(4,c.b/mx*100)}%"></div>`).join('')}</div>`:'<div class="empty">Crie sua primeira campanha para ver o gráfico.</div>'}</div>
  <div class="card mu">Protótipo: não há integração com contas de anúncios nem cobrança. Nada é publicado ou gasto sem sua aprovação.</div>`;
}
function vPr(){
  return head('Catálogo','Meus produtos','Cadastre produtos de afiliação e deixe a IA avaliar o potencial.')+
  `<div class="card"><h3>Novo produto</h3><div class="f"><input id="pn" placeholder="Nome do produto"><select id="pl"><option>Hotmart</option><option>Amazon</option><option>Shopee</option><option>Mercado Livre</option><option>Outra</option></select><input id="pr" type="number" min="0" placeholder="Preço (R$)"><input id="cm" type="number" min="0" max="100" placeholder="Comissão (%)"><input id="lk" placeholder="Link de afiliado"></div><button class="btn" onclick="addP()">Adicionar produto</button></div>`+
  (S.products.length?S.products.map(p=>`<div class="card"><div class="row"><div style="flex:1;min-width:150px"><h3>${esc(p.n)} ${p.est?'<span class="badge wa">confirmar na plataforma</span>':''}</h3><div class="mu">${esc(p.pl)} · ${brl(p.pr)} · comissão ${p.cm}% · ganho/venda ≈ ${brl(p.pr*p.cm/100)}</div></div>${p.an?`<div class="score" data-s="${p.an.score}" style="--p:${p.an.score}%"></div>`:''}</div>${p.an?`<div class="an"><div><b>Resumo:</b> ${esc(p.an.resumo)}</div><div><b>Público:</b> ${esc(p.an.publico)}</div><div><b>Ângulo:</b> ${esc(p.an.angulo)}</div><div><b>Riscos:</b> ${esc(p.an.riscos)}</div></div>`:''}${p.lk?'':`<div class="row" style="margin-top:10px"><input id="lk${p.id}" placeholder="Cole seu link de afiliado" style="flex:1"><button class="btn s" onclick="setLk(${p.id})">Salvar link</button></div>`}<div class="row" style="margin-top:12px"><button class="btn s" onclick="analyze(${p.id})">✧ Analisar com IA</button><button class="btn s" onclick="go('ca')">Criar campanha</button><button class="btn d" onclick="delP(${p.id})">Remover</button></div></div>`).join(''):'<div class="card empty">Nenhum produto ainda. Adicione o primeiro acima.</div>');
}
function vCa(){
  return head('Marketing','Campanhas','A IA escreve o texto; você aprova antes de qualquer gasto.')+
  (S.products.length?`<div class="card"><h3>Nova campanha</h3><div class="f"><select id="cp">${S.products.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select><select id="cc"><option>Instagram</option><option>TikTok</option><option>Google Ads</option><option>WhatsApp</option><option>YouTube</option></select><input id="cb" type="number" min="0" placeholder="Orçamento diário (R$)"></div><button class="btn" onclick="addC()">✧ Criar com IA</button></div>`:'<div class="card empty">Cadastre um produto primeiro.</div>')+
  S.campaigns.slice().reverse().map(c=>`<div class="card"><div class="row"><h3 style="flex:1">${esc(c.pn)} · ${esc(c.canal)}</h3><span class="badge ${c.st==='aprovada'?'ok':c.st==='pendente'?'wa':'er'}">${c.st}</span></div><div class="mu">Orçamento ${brl(c.b)}/dia</div>${c.copy?`<div class="an"><b>${esc(c.copy.titulo)}</b><div>${esc(c.copy.texto)}</div><div class="mu">${esc(c.copy.hashtags)}</div></div>`:''}<div class="row" style="margin-top:10px"><button class="btn d" onclick="delC(${c.id})">Excluir</button></div></div>`).join('');
}
function vAp(){
  const l=pend();
  return head('Controle','Aprovações','Nenhuma campanha é ativada nem gasta sem a sua decisão.')+
  (l.length?l.map(c=>{const over=S.spent+c.b>S.limit;return `<div class="card"><div class="row"><h3 style="flex:1">${esc(c.pn)} · ${esc(c.canal)}</h3><span class="badge ${over?'er':'wa'}">${brl(c.b)}</span></div>${c.copy?`<div class="an"><b>${esc(c.copy.titulo)}</b><div>${esc(c.copy.texto)}</div></div>`:''}${over?`<p class="mu" style="color:var(--er)">Excede o limite diário (${brl(S.limit)}). Ajuste o limite em Ajustes para aprovar.</p>`:''}<div class="row" style="margin-top:10px"><button class="btn g" ${over?'disabled':''} onclick="dec(${c.id},'aprovada')">Aprovar</button><button class="btn d" onclick="dec(${c.id},'rejeitada')">Rejeitar</button></div></div>`}).join(''):'<div class="card empty">Tudo em dia. Novas campanhas aparecerão aqui para revisão.</div>');
}
function vAs(){
  const sug=['Quais produtos devo priorizar?','Ideias de conteúdo para TikTok','Como melhorar minhas campanhas?'];
  return head('Inteligência artificial','Assistente IA','Tire dúvidas sobre afiliação, conteúdo, público e estratégia.')+
  `<div class="card"><div class="row">${sug.map(s=>`<button class="btn s" onclick="ask('${s}')">${s}</button>`).join('')}</div><div class="chat" id="chat">${chat.length?chat.map(m=>`<div class="m ${m.r}">${esc(m.t).replace(/\n/g,'<br>')}</div>`).join(''):'<div class="empty">Converse com a IA. Ela conhece seus produtos e campanhas.</div>'}</div><div class="row"><input id="q" placeholder="Pergunte algo…" style="flex:1" onkeydown="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">Enviar</button></div></div>`;
}
function vCf(){
  return head('Preferências','Ajustes','Defina limites e faça backup dos seus dados.')+perfilCard()+
  `<div class="card"><h3>Controle de orçamento</h3><p class="mu">Limite máximo diário que você deseja respeitar.</p><input id="lm" type="number" min="0" value="${S.limit}" style="max-width:240px"><div style="margin-top:12px"><button class="btn" onclick="setLim()">Salvar limite</button></div></div>
  <div class="card"><h3>Backup dos dados</h3><p class="mu">Exporte produtos e campanhas. O backup inclui os dados salvos neste navegador.</p><div class="row"><button class="btn s" onclick="exp()">↓ Exportar backup JSON</button><button class="btn s" onclick="$('#fi').click()">↑ Importar backup</button><input id="fi" type="file" accept=".json" hidden onchange="imp(this)"></div></div>
  <div class="card"><h3>Zona de dados</h3><p class="mu">Apague os dados locais deste protótipo.</p><button class="btn d" onclick="clr()">Limpar dados locais</button></div>`;
}
const loc=d=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`};
function vAg(){
  const ps=(S.posts||[]).slice().sort((a,b)=>a.w.localeCompare(b.w)),np=ps.filter(p=>p.st==='pendente').length,now=loc(new Date());
  return head('Automação','Agenda de posts','A IA planeja a semana, você pré-aprova uma vez e publica pela fila.')+
  `<div class="card mu">Esta página não publica sozinha: ela só roda com o app aberto. Para postar offline, exporte a fila em CSV e carregue em um agendador (Meta Business Suite, Metricool, Buffer). Posts orgânicos não gastam; anúncios pagos continuam exigindo aprovação.</div>`+
  (S.products.length?`<div class="card"><h3>✧ Gerar plano com IA</h3><div class="f"><select id="gp">${S.products.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select><select id="gc"><option>Instagram</option><option>TikTok</option><option>WhatsApp</option><option>YouTube</option></select><select id="gq"><option>3</option><option>5</option><option>7</option></select></div><button class="btn" onclick="genPlan()">Gerar posts</button></div>`:'<div class="card empty">Cadastre um produto para gerar posts.</div>')+
  (ps.length?`<div class="row" style="margin-bottom:12px"><button class="btn g" ${np?'':'disabled'} onclick="preAll()">Pré-aprovar ${np} pendentes</button><button class="btn s" onclick="csv()">↓ Exportar CSV</button></div>`:'')+

  if(r&&typeof r.score!=='undefined'){r.score=Math.max(0,Math.min(100,Math.round(+r.score)));p.an=r;save();render()}}
async function addC(){const p=S.products.find(x=>x.id==$('#cp').value);if(!p)return;const b=+$('#cb').value||0,canal=$('#cc').value;toast('A IA está escrevendo…');
  const copy=await ai(`Você é redator de afiliados no Brasil. Crie um anúncio honesto, sem promessas falsas, para ${canal}. Responda SOMENTE JSON: {"titulo":"","texto":"até 280 caracteres","hashtags":"3 a 5 hashtags"}. Produto: ${p.n} (${p.pl}), preço R$ ${p.pr}.`,true);
  S.campaigns.push({id:Date.now(),pid:p.id,pn:p.n,canal,b,copy:copy&&copy.titulo?copy:null,st:'pendente'});save();render();toast('Campanha enviada para aprovação.')}
function delC(id){S.campaigns=S.campaigns.filter(c=>c.id!==id);save();render()}
function dec(id,st){const c=S.campaigns.find(x=>x.id===id);if(st==='aprovada'){if(S.spent+c.b>S.limit)return toast('Excede o limite diário.');S.spent+=c.b}c.st=st;save();render()}
async function insight(){toast('Analisando seu cenário…');const t=await ai(ctx()+'\nFaça um resumo estratégico curto (máx. 6 linhas) com 3 próximas ações práticas. Português, direto, sem markdown.');if(t){S.insight=t;save();render()}}
async function ask(q){q=q||$('#q').value.trim();if(!q)return;chat.push({r:'u',t:q});render();
  const h=chat.slice(-8).map(m=>(m.r==='u'?'Usuário: ':'Assistente: ')+m.t).join('\n');
  const t=await ai(ctx()+'\nVocê é o assistente do AfiliAI Pro, especialista em marketing de afiliados no Brasil. Responda em português, claro e objetivo, sem prometer ganhos garantidos.\n'+h+'\nAssistente:');
  chat.push({r:'a',t:t||'Não consegui responder agora. Tente novamente.'});render();const c=$('#chat');if(c)c.scrollTop=c.scrollHeight}
function setLim(){S.limit=Math.max(0,+$('#lm').value||0);save();render();toast('Limite salvo.')}
async function exp(){try{dlf({filename:'afiliai-backup.json',data:JSON.stringify(S,null,2)})}catch(e){toast('Não foi possível exportar aqui.')}}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.products))throw 0;S=Object.assign(S,d);save();render();toast('Backup importado.')}catch(e){toast('Arquivo inválido.')}};r.readAsText(f)}
function clr(){if(confirm('Apagar todos os dados, inclusive o cofre?')){S={limit:10,spent:0,day:today(),products:[],campaigns:[],posts:[],perfil:{},insight:''};save();chat=[];render()}}
render();initCloud().then(()=>{if(S.perm&&S.perm.auto&&S.lastRun!==today()&&S.products.length)routine(true)});
</script>
</body>
